command:
  - "python"
  - "-m"
  - "uvicorn"
  - "app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # ---------------------------------------------------------------------------
  # Lakebase Postgres (app state).
  # PGHOST / PGUSER are environment-specific. `scripts/deploy.py` fills these in
  # for you; if you edit by hand, set PGHOST to your Lakebase endpoint host and
  # PGUSER to the app's service-principal client id (the app authenticates as
  # itself and uses its OAuth token as the Postgres password — no stored secret).
  # ---------------------------------------------------------------------------
  - name: PGHOST
    value: "ep-calm-scene-d1m74u39.database.us-west-2.cloud.databricks.com"                       # e.g. ep-xxxx.database.us-west-2.cloud.databricks.com
  - name: PGPORT
    value: "5432"
  - name: PGDATABASE
    value: "app"
  - name: PGUSER
    value: "5f72cb85-5f41-4036-85cd-11e0bc156486"                       # app service-principal client id (UUID)

  # SQL warehouse for system-table reads, Unity Catalog access, and ai_query()
  # enrichment. Injected from the bound sql_warehouse resource below.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"

  # Foundation Model endpoint for the AI agents (chat-completions compatible).
  - name: SERVING_ENDPOINT
    value: "databricks-claude-sonnet-5"

  # Foundation Model endpoint for SQL ai_query() batch enrichment. Keep separate
  # from SERVING_ENDPOINT because not every chat endpoint supports ai_query().
  - name: AI_QUERY_ENDPOINT
    value: "databricks-claude-sonnet-4-5"

  # ---------------------------------------------------------------------------
  # Discovery layer (Unity Catalog). The app writes workspace-metadata inventory
  # and ai_query() enrichment staging here. Requires USE_CATALOG + a schema the
  # app SP can CREATE TABLE / MODIFY / SELECT in — the in-app Setup wizard
  # (/api/setup/*) probes this and prints the exact GRANT statements if not.
  # ---------------------------------------------------------------------------
  - name: ATLAS_CATALOG
    value: "grid_ops_demo_catalog"                       # e.g. main
  - name: ATLAS_SCHEMA
    value: "grid_atlas_discovery"

  # Genie space over the portfolio mirror (optional; set after creating a space).
  - name: GENIE_SPACE_ID
    value: "01f19588289f16c78dab137eb896836d"

  # Unity Catalog target for the Genie mirror of the portfolio.
  - name: GENIE_MIRROR_CATALOG
    value: "grid_ops_demo_catalog"                       # e.g. main
  - name: GENIE_MIRROR_SCHEMA
    value: "grid_atlas"

  # Demo Mode toggle (ISOLATED, removable feature — see DEMO_MODE.md).
  # Ship OFF for customer / Marketplace installs.
  - name: DEMO_MODE
    value: "off"

  # Visible environment marker. Deploy sets this to PROD or DEV.
  - name: APP_ENV
    value: "PROD"

  # Log level. INFO is right for normal operation; DEBUG turns up detail on a
  # deployed app without a code change or redeploy.
  - name: LOG_LEVEL
    value: "INFO"

  # Per-actor rate limits on the expensive endpoints (LLM calls and warehouse
  # sweeps). Guard rails against accidental load — a room full of workshop
  # attendees clicking at once, or a UI retry loop — not a quota system.
  # Set to "off" for a demo where a presenter is deliberately clicking fast.
  - name: RATE_LIMITS
    value: "on"

resources:
  - name: "sql-warehouse"
    description: "Warehouse for system-table reads, UC discovery, and ai_query() enrichment."
    sql_warehouse:
      id: "7fb5ec85684023e6"                        # your warehouse id — deploy.py fills this in
      permission: "CAN_USE"
  - name: "ai-query-endpoint"
    description: "Foundation Model endpoint used by SQL ai_query() batch enrichment."
    serving_endpoint:
      name: "databricks-claude-sonnet-4-5"
      permission: "CAN_QUERY"
  - name: "serving-endpoint"
    description: "Foundation Model endpoint backing the AI agents."
    serving_endpoint:
      name: "databricks-claude-sonnet-5"
      permission: "CAN_QUERY"
