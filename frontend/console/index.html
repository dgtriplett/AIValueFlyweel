<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Atlas — Setup &amp; Discovery Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!--
      WHY THIS PAGE IS PLAIN HTML/JS AND NOT PART OF THE REACT SPA
      ============================================================
      The SPA's TypeScript source is not in this repository — only its built
      bundle is (see README, "A note on the frontend source"). Adding screens to
      it would mean reverse-engineering a minified bundle, and a mistake there
      breaks the portfolio UI that already works.

      So the operator-facing console ships as one dependency-free page instead:
      no build step, nothing to bundle, and no way for it to affect the SPA. It
      covers the workflows added by the discovery/agent layers, which are
      admin-shaped anyway (run a pipeline, review a mapping, approve a proposal)
      and belong beside a status page rather than inside the portfolio views.

      Styling mirrors frontend/tailwind.config.js — the Databricks Blueprint
      dark palette — so it reads as the same product.
    -->
    <style>
      :root {
        --navy-900: #0b2026; --navy-800: #1b3139; --navy-700: #143d4a;
        --navy-600: #2a4a56; --navy-500: #618794; --navy-400: #90a5b1;
        --navy-300: #c4ccd6;
        --lava: #ff3621; --lava-400: #ff9e94; --lava-700: #bd2b26;
        --success: #00a972; --success-300: #9ed6c4;
        --warning: #ffab00; --warning-300: #ffdb96;
        --info: #2272b4; --info-400: #8acaff;
        --oat: #f9f7f4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: var(--navy-900); color: var(--oat);
        font-family: "DM Sans", system-ui, sans-serif; font-size: 14px;
        line-height: 1.5; -webkit-font-smoothing: antialiased;
      }
      code, pre, .mono { font-family: "DM Mono", ui-monospace, monospace; }
      a { color: var(--info-400); }

      /* CHROME MATCHES THE SPA EXACTLY.
         The console used to have a left sidebar while the portfolio has top tabs,
         so moving between them felt like leaving the app — and getting back needed
         a "← Portfolio" link in the corner. Same header, same tab row, same
         max-width means the two halves read as one product and the portfolio tabs
         are always one click away. */
      header {
        background: var(--navy-800); border-bottom: 1px solid var(--navy-600);
        position: sticky; top: 0; z-index: 30;
        backdrop-filter: blur(8px);
      }
      header .inner { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
      header .top {
        padding: 12px 0; display: flex; align-items: center;
        justify-content: space-between; gap: 12px;
      }
      header .brand { display: flex; align-items: center; gap: 12px; }
      header .mark {
        width: 40px; height: 40px; border-radius: 8px; background: var(--lava);
        display: flex; align-items: center; justify-content: center;
        font-size: 20px; line-height: 1;
      }
      header h1 {
        font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.02em;
        color: #fff;
      }
      header h1 .accent { color: var(--lava); }
      header .sub { font-size: 12px; color: var(--navy-400); margin-top: -2px; }
      header .meta {
        display: flex; align-items: center; gap: 8px; font-size: 12px;
        color: var(--navy-500);
      }
      header .badge {
        border: 1px solid var(--navy-600); border-radius: 999px;
        padding: 3px 10px; color: var(--navy-300); font-family: "DM Mono", monospace;
      }

      /* One continuous tab row: portfolio tabs (links into the SPA) then console
         tabs. The divider marks the boundary without breaking the line. */
      nav.tabs { display: flex; gap: 2px; overflow-x: auto; }
      nav.tabs a, nav.tabs button {
        appearance: none; background: none; border: none;
        border-bottom: 2px solid transparent; color: var(--navy-400);
        padding: 10px 14px; font: inherit; font-size: 14px; font-weight: 500;
        cursor: pointer; white-space: nowrap; text-decoration: none;
        display: flex; align-items: center; gap: 7px;
      }
      nav.tabs a:hover, nav.tabs button:hover { color: var(--navy-300); }
      nav.tabs [aria-current="page"] {
        border-bottom-color: var(--lava); color: var(--lava-400);
      }
      nav.tabs .divider {
        width: 1px; background: var(--navy-600); margin: 8px 10px; flex-shrink: 0;
      }
      nav.tabs .group-label {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--navy-500); align-self: center; padding: 0 8px 0 2px;
      }
      .layout { max-width: 1440px; margin: 0 auto; padding: 0 24px; }
      main { padding: 24px 0 60px; max-width: 1100px; }
      h2 { font-size: 20px; margin: 0 0 4px; font-weight: 600; letter-spacing: -0.01em; }
      .lede { color: var(--navy-400); margin: 0 0 20px; max-width: 70ch; }
      section { margin-bottom: 28px; }

      .card {
        background: var(--navy-800); border: 1px solid var(--navy-600);
        border-radius: 8px; padding: 16px 18px; margin-bottom: 14px;
      }
      .card h3 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
      .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .grow { flex: 1; }

      button.action {
        background: var(--lava); color: #fff; border: none; border-radius: 4px;
        padding: 8px 14px; font: inherit; font-weight: 500; cursor: pointer;
      }
      button.action:hover:not(:disabled) { background: var(--lava-700); }
      button.action.secondary {
        background: transparent; border: 1px solid var(--navy-500);
        color: var(--navy-300);
      }
      button.action.secondary:hover:not(:disabled) {
        border-color: var(--navy-400); color: var(--oat);
      }
      button.action:disabled { opacity: 0.45; cursor: not-allowed; }

      input, select, textarea {
        background: var(--navy-900); color: var(--oat);
        border: 1px solid var(--navy-600); border-radius: 4px;
        padding: 7px 10px; font: inherit;
      }
      input:focus, select:focus { outline: 2px solid var(--info); outline-offset: -1px; }
      label { color: var(--navy-300); font-size: 12px; display: block; margin-bottom: 4px; }
      .field { margin-bottom: 12px; }

      .pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
      .pill {
        display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px;
        border-radius: 999px; font-size: 12px; font-weight: 500;
        border: 1px solid transparent; cursor: default;
      }
      .pill.ok { background: rgba(0,169,114,0.14); color: var(--success-300);
                 border-color: rgba(0,169,114,0.4); }
      .pill.bad { background: rgba(255,54,33,0.14); color: var(--lava-400);
                  border-color: rgba(255,54,33,0.45); }
      .pill.warn { background: rgba(255,171,0,0.13); color: var(--warning-300);
                   border-color: rgba(255,171,0,0.4); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--navy-700); }
      th { color: var(--navy-400); font-weight: 500; font-size: 11px;
           text-transform: uppercase; letter-spacing: 0.04em; }
      tbody tr:hover { background: var(--navy-700); }
      .num { text-align: right; font-family: "DM Mono", monospace; }

      pre.sql {
        background: var(--navy-900); border: 1px solid var(--navy-600);
        border-radius: 4px; padding: 12px; overflow-x: auto; font-size: 12px;
        margin: 10px 0 0; white-space: pre; color: var(--navy-300);
      }
      .muted { color: var(--navy-400); }
      .small { font-size: 12px; }
      .stat { display: flex; gap: 26px; flex-wrap: wrap; }
      .stat div span { display: block; }
      .stat .k { color: var(--navy-400); font-size: 11px; text-transform: uppercase;
                 letter-spacing: 0.04em; }
      .stat .v { font-size: 22px; font-weight: 600; font-family: "DM Mono", monospace; }

      .banner { border-radius: 6px; padding: 11px 14px; margin-bottom: 16px; font-size: 13px; }
      .banner.err { background: rgba(255,54,33,0.12); border: 1px solid rgba(255,54,33,0.4);
                    color: var(--lava-400); }
      .banner.ok { background: rgba(0,169,114,0.12); border: 1px solid rgba(0,169,114,0.4);
                   color: var(--success-300); }
      .banner.info { background: rgba(34,114,180,0.12); border: 1px solid rgba(34,114,180,0.4);
                     color: var(--info-400); }
      .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--navy-500);
              border-top-color: var(--lava); border-radius: 50%; animation: spin 0.7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .hidden { display: none !important; }
      ul.tight { margin: 6px 0 0; padding-left: 20px; }
      ul.tight li { margin-bottom: 3px; }

      /* Guided steps. The number badge doubles as a state indicator so the
         sequence reads at a glance without a separate legend. */
      .step { display: flex; gap: 14px; margin-bottom: 14px; }
      .step-num {
        flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: 600; font-family: "DM Mono", monospace;
        background: var(--navy-600); color: var(--navy-300);
        border: 1px solid var(--navy-500); margin-top: 14px;
      }
      .step-num.done { background: rgba(0,169,114,0.18); color: var(--success-300);
                       border-color: rgba(0,169,114,0.5); }
      .step-num.active { background: rgba(255,54,33,0.16); color: var(--lava-400);
                         border-color: var(--lava); }
      .step .card { flex: 1; margin-bottom: 0; }
      .step.locked .card { opacity: 0.55; }
      .step-why {
        font-size: 12px; color: var(--navy-400); margin: 0 0 10px;
        padding-left: 10px; border-left: 2px solid var(--navy-600);
      }

      /* Coverage matrix */
      table.matrix { font-size: 12px; }
      table.matrix th.rot { writing-mode: vertical-rl; text-orientation: mixed;
                            height: 96px; padding: 6px 3px; white-space: nowrap; }
      table.matrix td.cell { text-align: center; padding: 4px; cursor: default; }
      .swatch { display: inline-block; width: 100%; height: 20px; border-radius: 3px;
                line-height: 20px; font-size: 10px; font-family: "DM Mono", monospace; }
      .sw-covered   { background: rgba(0,169,114,0.30); color: var(--success-300); }
      .sw-gap       { background: rgba(255,54,33,0.28);  color: var(--lava-400); }
      .sw-available { background: rgba(34,114,180,0.28); color: var(--info-400); }
      .sw-unused    { background: var(--navy-700); color: var(--navy-500); }
      .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px;
                margin-bottom: 14px; }

      /* Sankey. Rendered as inline SVG rather than a charting library: the console
         ships without a build step, and a 4-column flow is a simple enough layout
         that a dependency would cost more than it saves. */
      svg.sankey { width: 100%; height: auto; display: block; }
      svg.sankey .link { fill: none; opacity: 0.30; }
      svg.sankey .link:hover { opacity: 0.65; }
      svg.sankey text { font-size: 10px; fill: var(--navy-300); }
      svg.sankey .col-label { font-size: 10px; fill: var(--navy-500);
                              text-transform: uppercase; letter-spacing: 0.08em; }

      /* Chat */
      .chat-log { display: flex; flex-direction: column; gap: 12px;
                  margin-bottom: 16px; }
      .msg { max-width: 78%; padding: 10px 14px; border-radius: 10px; font-size: 14px; }
      .msg.user { align-self: flex-end; background: var(--navy-600); color: var(--oat); }
      .msg.assistant { align-self: flex-start; background: var(--navy-800);
                       border: 1px solid var(--navy-600); }
      .msg.tool { align-self: flex-start; background: transparent;
                  border-left: 2px solid var(--navy-600); border-radius: 0;
                  color: var(--navy-400); font-size: 12px; padding: 2px 10px;
                  font-family: "DM Mono", monospace; max-width: 100%; }
      .chat-input { display: flex; gap: 10px; }
      .chat-input input { flex: 1; }
      .suggestions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
      .suggestions button {
        background: var(--navy-800); border: 1px solid var(--navy-600);
        color: var(--navy-300); border-radius: 999px; padding: 6px 13px;
        font: inherit; font-size: 12px; cursor: pointer;
      }
      .suggestions button:hover { border-color: var(--navy-400); color: var(--oat); }
      .legend span.key { display: inline-block; width: 13px; height: 13px;
                         border-radius: 3px; vertical-align: -2px; margin-right: 5px; }
    </style>
  </head>
  <body>
    <!--
      The header and tab row mirror the SPA's chrome so the two halves of the app
      read as one product. The portfolio tabs are real links into the SPA (its tab
      state is internal, so a link lands on its default view) followed by the
      console's own tabs after a divider — which removes the need for a corner
      "back to Portfolio" escape hatch that made the console feel like a separate
      site.
    -->
    <header>
      <div class="inner">
        <div class="top">
          <div class="brand">
            <div class="mark" aria-hidden="true">⚡</div>
            <div>
              <h1>Grid <span class="accent">Atlas</span></h1>
              <div class="sub">Power &amp; Utilities — Data &amp; AI Catalog, Value &amp; Roadmap</div>
            </div>
          </div>
          <div class="meta">
            <span id="env" class="badge"></span>
            <span>Powered by Databricks</span>
          </div>
        </div>
        <nav class="tabs" id="nav" aria-label="Sections">
          <a href="/">Portfolio</a>
          <a href="/">Data Assets</a>
          <a href="/">Dashboards</a>
          <a href="/">Roadmap</a>
          <div class="divider" aria-hidden="true"></div>
          <span class="group-label">Setup</span>
          <!--
            ONE onboarding surface. The SPA used to have a "Get Started" tab (Excel
            bulk-populate + auto-populate from system tables) while the console had
            separate "Setup & health" and "Discovery" views — three places answering
            "how do I get my data in?". Merged into the guided flow below, keeping
            the best of each: health probes with copy-pastable GRANTs, the Excel
            round-trip, and the multi-workspace sweep + AI enrichment.
          -->
          <button data-view="start" aria-current="page">Get started</button>
          <button data-view="ask">Ask</button>
          <button data-view="research">Research</button>
          <button data-view="coverage">Coverage &amp; gaps</button>
          <button data-view="flow">Value flow</button>
          <button data-view="catalog">Catalog</button>
          <button data-view="generate">Generate use cases</button>
          <button data-view="admin">Admin</button>
        </nav>
      </div>
    </header>

    <div class="layout">
      <main id="main" aria-live="polite">
        <p class="muted"><span class="spin"></span> Loading…</p>
      </main>
    </div>

    <script src="./console.js"></script>
  </body>
</html>
